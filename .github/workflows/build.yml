name: Build Manim Bootstrap

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bootstrap version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── QEMU for arm64 emulation ────────────────────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Determine version ───────────────────────────────────────────────────
      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      # ── Build arm64 rootfs (Optimized with GHA Cache) ───────────────────────
      - name: Build rootfs image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          outputs: type=local,dest=./rootfs
          build-args: BOOTSTRAP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Package rootfs (Optimized Symlinks & Compression) ───────────────────
      - name: Create bootstrap archive
        run: |
          # Install pigz for multi-core compression
          sudo apt-get update -y && sudo apt-get install -y pigz

          cd rootfs

          # Process all absolute symlinks in a single Python execution (Runs in milliseconds)
          echo "Converting absolute symlinks to relative..."
          python3 -c "
          import os

          for root, dirs, files in os.walk('.'):
              for name in dirs + files:
                  path = os.path.join(root, name)
                  if os.path.islink(path):
                      target = os.readlink(path)
                      if target.startswith('/'):
                          # Reconstruct absolute paths for relative calculation
                          link_dir = '/' + os.path.dirname(path).lstrip('./')
                          rel = os.path.relpath(target, link_dir)
                          
                          # Re-link
                          os.remove(path)
                          os.symlink(rel, path)
                          print(f'  Fixed: {path} -> {rel}')
          "

          ARCHIVE="manim-bootstrap-aarch64-v${{ steps.version.outputs.version }}.tar.gz"
          echo "Creating ${ARCHIVE} using pigz (multi-threaded)..."

          # Use pigz instead of gzip for vastly faster compression
          tar -I pigz -cf "../${ARCHIVE}" \
            --hard-dereference \
            --exclude='./proc' \
            --exclude='./sys' \
            --exclude='./dev' \
            --exclude='./tmp' \
            --exclude='./run' \
            .

          cd ..
          du -sh "${ARCHIVE}"
          echo "archive_name=${ARCHIVE}" >> $GITHUB_ENV

      # ── Extract Termux proot binary from their apt repo ─────────────────────
      - name: Extract proot from Termux apt repository
        run: |
          echo "Fetching Termux package index..."
          wget -q \
            "https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages.gz" \
            -O packages.gz

          PROOT_PATH=$(zcat packages.gz | \
            awk '/^Package: proot$/{found=1} found && /^Filename:/{print $2; exit}')

          if [ -z "$PROOT_PATH" ]; then
            echo "ERROR: Could not find proot in Termux package index"
            exit 1
          fi

          PROOT_URL="https://packages.termux.dev/apt/termux-main/${PROOT_PATH}"
          echo "Found proot at: ${PROOT_URL}"

          wget -q "${PROOT_URL}" -O proot.deb
          ls -lh proot.deb

          mkdir -p proot_extract
          cd proot_extract
          ar x ../proot.deb
          
          # Added sudo to apt-get to prevent permission denied errors in standard runners
          if [ -f "data.tar.xz" ]; then
            tar xf data.tar.xz
          elif [ -f "data.tar.zst" ]; then
            sudo apt-get install -y zstd 2>/dev/null || true
            zstd -d data.tar.zst -o data.tar
            tar xf data.tar
          fi
          
          PROOT_BIN=$(find . -name "proot" -type f | head -1)
          if [ -z "$PROOT_BIN" ]; then
            echo "ERROR: proot binary not found in .deb"
            find . -type f | head -20
            exit 1
          fi
          
          echo "Found proot binary at: ${PROOT_BIN}"
          cp "${PROOT_BIN}" ../proot-aarch64
          cd ..

          file proot-aarch64
          ls -lh proot-aarch64

      # ── Update manifest with real URLs ──────────────────────────────────────
      - name: Update manifest
        run: |
          VERSION=${{ steps.version.outputs.version }}
          ARCHIVE="${{ env.archive_name }}"
          ARCHIVE_SIZE=$(stat -c%s "${ARCHIVE}")
          ARCHIVE_SHA256=$(sha256sum "${ARCHIVE}" | cut -d' ' -f1)
          PROOT_SHA256=$(sha256sum proot-aarch64 | cut -d' ' -f1)

          cat > bootstrap-manifest.json << EOF
          {
            "version": "${VERSION}",
            "manim_version": "0.18.1",
            "python_version": "3.11",
            "arch": "aarch64",
            "min_app_version": 1,
            "release_url": "https://github.com/snxw9/manim-studio-bootstrap/releases/tag/v${VERSION}",
            "bootstrap_url": "https://github.com/snxw9/manim-studio-bootstrap/releases/download/v${VERSION}/${ARCHIVE}",
            "bootstrap_size_bytes": ${ARCHIVE_SIZE},
            "bootstrap_sha256": "${ARCHIVE_SHA256}",
            "proot_url": "https://github.com/snxw9/manim-studio-bootstrap/releases/download/v${VERSION}/proot-aarch64",
            "proot_sha256": "${PROOT_SHA256}",
            "changelog": "Bootstrap v${VERSION} — Debian 12, Manim 0.18.1, LaTeX included, optimized",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          echo "Manifest:"
          cat bootstrap-manifest.json

      # ── Create GitHub Release ────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Bootstrap v${{ steps.version.outputs.version }}
          body: |
            ## Manim Studio Bootstrap v${{ steps.version.outputs.version }}

            Complete Debian Linux arm64 rootfs with Manim pre-installed.

            ### Contents
            - Debian Linux 12 (aarch64)
            - Python 3.11
            - Manim Community Edition 0.18.1
            - Cairo + pycairo (pre-built)
            - Pango + manimpango
            - FFmpeg
            - LaTeX (texlive + dvisvgm for MathTex)
            - DejaVu + Noto fonts

            ### Files
            - `manim-bootstrap-aarch64-v${{ steps.version.outputs.version }}.tar.gz` — rootfs archive (~400MB)
            - `proot-aarch64` — Termux proot binary for Android
            - `bootstrap-manifest.json` — version metadata

            ### Checksums
            See `bootstrap-manifest.json` for SHA256 hashes.
          files: |
            ${{ env.archive_name }}
            proot-aarch64
            bootstrap-manifest.json
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
