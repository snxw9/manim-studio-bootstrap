name: Build Manim Bootstrap

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bootstrap version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── System Dependencies ─────────────────────────────────────────────────
      - name: Install build tools (symlinks, zstd, pigz)
        run: |
          sudo apt-get update
          sudo apt-get install -y symlinks zstd pigz

      # ── QEMU for arm64 emulation ────────────────────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Determine version ───────────────────────────────────────────────────
      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      # ── Build arm64 rootfs (WITH CACHE) ─────────────────────────────────────
      - name: Build rootfs image
        run: |
          # Use --load instead of type=local to save it to the Docker daemon natively
          docker buildx build \
            --platform linux/arm64 \
            --build-arg BOOTSTRAP_VERSION=${{ steps.version.outputs.version }} \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            -t manim-bootstrap-img \
            --progress plain \
            .

      # ── Package rootfs ──────────────────────────────────────────────────────
      - name: Create bootstrap archive
        run: |
          echo "Exporting flat filesystem from Docker..."
          
          # Create a dummy container from the image
          docker create --name temp_rootfs manim-bootstrap-img
          
          # Export the filesystem as a tar stream and extract it natively on the runner
          mkdir -p rootfs
          docker export temp_rootfs | tar -xC rootfs
          
          # Clean up the dummy container
          docker rm temp_rootfs
          
          cd rootfs

          # The 'symlinks' utility instantly converts absolute links to relative
          echo "Converting absolute symlinks to relative..."
          symlinks -cr .

          ARCHIVE="manim-bootstrap-aarch64-v${{ steps.version.outputs.version }}.tar.gz"
          echo "Creating ${ARCHIVE}..."

          echo "🔍 X-RAY: Scanning rootfs for biggest folders..."
          if [ -d ./rootfs ]; then du -ah ./rootfs; else du -ah .; fi | sort -rh | head -n 30
          echo "──────────────────────────────────────────────"

          # Use pigz for fast, multi-threaded compression
          tar -I pigz -cf "../${ARCHIVE}" \
            --hard-dereference \
            --exclude='./proc' \
            --exclude='./sys' \
            --exclude='./dev' \
            --exclude='./tmp' \
            --exclude='./run' \
            .

          cd ..
          du -sh "${ARCHIVE}"
          echo "archive_name=${ARCHIVE}" >> $GITHUB_ENV

      # ── Extract Termux proot binary from their apt repo ─────────────────────
      - name: Extract proot from Termux apt repository
        run: |
          echo "Fetching Termux package index..."
          wget -q \
            "https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages.gz" \
            -O packages.gz

          PROOT_PATH=$(zcat packages.gz | \
            awk '/^Package: proot$/{found=1} found && /^Filename:/{print $2; exit}')

          if [ -z "$PROOT_PATH" ]; then
            echo "ERROR: Could not find proot in Termux package index"
            exit 1
          fi

          PROOT_URL="https://packages.termux.dev/apt/termux-main/${PROOT_PATH}"
          echo "Found proot at: ${PROOT_URL}"

          wget -q "${PROOT_URL}" -O proot.deb
          ls -lh proot.deb

          mkdir -p proot_extract
          cd proot_extract
          ar x ../proot.deb
          
          # Added sudo to apt-get to prevent permission denied errors in standard runners
          if [ -f "data.tar.xz" ]; then
            tar xf data.tar.xz
          elif [ -f "data.tar.zst" ]; then
            sudo apt-get install -y zstd 2>/dev/null || true
            zstd -d data.tar.zst -o data.tar
            tar xf data.tar
          fi
          
          PROOT_BIN=$(find . -name "proot" -type f | head -1)
          if [ -z "$PROOT_BIN" ]; then
            echo "ERROR: proot binary not found in .deb"
            find . -type f | head -20
            exit 1
          fi
          
          echo "Found proot binary at: ${PROOT_BIN}"
          cp "${PROOT_BIN}" ../proot-aarch64
          cd ..

          file proot-aarch64
          ls -lh proot-aarch64

      # ── Update manifest with real URLs ──────────────────────────────────────
      - name: Update manifest
        run: |
          VERSION=${{ steps.version.outputs.version }}
          ARCHIVE="${{ env.archive_name }}"
          ARCHIVE_SIZE=$(stat -c%s "${ARCHIVE}")
          ARCHIVE_SHA256=$(sha256sum "${ARCHIVE}" | cut -d' ' -f1)
          PROOT_SHA256=$(sha256sum proot-aarch64 | cut -d' ' -f1)

          cat > bootstrap-manifest.json << EOF
          {
            "version": "${VERSION}",
            "manim_version": "0.18.1",
            "python_version": "3.11",
            "arch": "aarch64",
            "min_app_version": 1,
            "release_url": "https://github.com/snxw9/manim-studio-bootstrap/releases/tag/v${VERSION}",
            "bootstrap_url": "https://github.com/snxw9/manim-studio-bootstrap/releases/download/v${VERSION}/${ARCHIVE}",
            "bootstrap_size_bytes": ${ARCHIVE_SIZE},
            "bootstrap_sha256": "${ARCHIVE_SHA256}",
            "proot_url": "https://github.com/snxw9/manim-studio-bootstrap/releases/download/v${VERSION}/proot-aarch64",
            "proot_sha256": "${PROOT_SHA256}",
            "changelog": "Bootstrap v${VERSION} — Debian 12, Manim 0.18.1, TinyTeX (Daily Release) included, optimized",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          echo "Manifest:"
          cat bootstrap-manifest.json

      # ── Create GitHub Release ────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Bootstrap v${{ steps.version.outputs.version }}
          body: |
            ## Manim Studio Bootstrap v${{ steps.version.outputs.version }}

            Complete Debian Linux arm64 rootfs with Manim pre-installed.

            ### Contents
            - Debian Linux 12 (aarch64)
            - Python 3.11
            - Manim Community Edition 0.18.1
            - Cairo + pycairo (pre-built)
            - Pango + manimpango
            - FFmpeg
            - LaTeX (TinyTeX + dvisvgm for MathTex)
            - DejaVu + Noto fonts

            ### Files
            - `manim-bootstrap-aarch64-v${{ steps.version.outputs.version }}.tar.gz` — rootfs archive (~400MB)
            - `proot-aarch64` — Termux proot binary for Android
            - `bootstrap-manifest.json` — version metadata

            ### Checksums
            See `bootstrap-manifest.json` for SHA256 hashes.
          files: |
            ${{ env.archive_name }}
            proot-aarch64
            bootstrap-manifest.json
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
